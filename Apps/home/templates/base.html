{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>{% block title %}Guías Académicas{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- Grayscale CSS -->
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
  </head>

  <body id="page-top">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
      <div class="container px-4 px-lg-5">
        <a class="navbar-brand text-uppercase fw-bold" href="{% url 'home' %}">Guías Académicas</a>
        <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false"
          aria-label="Toggle navigation">
          Menú
          <i class="fas fa-bars ms-1"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'listar_guias' %}">Ver Guías</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'crear_guia' %}">Subir Guía</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Registro</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Header -->
    <header class="masthead">
      <div class="container px-4 px-lg-5 d-flex h-100 align-items-center justify-content-center">
        <div class="d-flex justify-content-center">
          <div class="text-center text-white">
            <h1 class="mx-auto my-0 text-uppercase">Guías Académicas</h1>
            <h2 class="text-white-50 mx-auto mt-2 mb-5">Comparte y encuentra guías universitarias fácilmente</h2>
            <a class="btn btn-primary btn-lg" href="{% url 'listar_guias' %}">Explorar Guías</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Contenido -->
    <main class="container my-5">
      {% block content %}
      {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer bg-black small text-center text-white-50">
      <div class="container px-4 px-lg-5">
        © 2025 Guías Académicas
      </div>
    </footer>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
  </body>
</html>
