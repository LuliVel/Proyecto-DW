{% extends 'base.html' %}

{% block title %}Publicaciones{% endblock %}

{% block content %}
<h2>Guías y Materiales</h2>
{% for guia in guias %}
    <div class="guia">
        <h3>{{ guia.titulo }}</h3>
        <p>{{ guia.descripcion }}</p>
        <p><strong>Autor:</strong> {{ guia.autor.username }}</p>
    </div>
{% empty %}
    <p>No hay guías disponibles aún.</p>
{% endfor %}
{% endblock %}
