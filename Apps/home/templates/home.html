<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Guías Académicas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Guías Académicas</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Materias</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Subir Guía</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1 class="text-center">Bienvenido a la Plataforma de Guías Académicas</h1>
    <form class="d-flex my-4">
      <input class="form-control me-2" type="search" placeholder="Buscar guía...">
      <button class="btn btn-primary" type="submit">Buscar</button>
    </form>
    <div class="row">
      <div class="col-md-4"><div class="card p-3">Matemáticas</div></div>
      <div class="col-md-4"><div class="card p-3">Historia</div></div>
      <div class="col-md-4"><div class="card p-3">Lengua</div></div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-4">
    © 2025 Guías Académicas - Todos los derechos reservados
  </footer>
</body>
</html>
